name: build-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # GHCR requires lowercase repository names; github.repository preserves the
  # owner's casing (USBKayble), so hardcode the canonical lowercase form.
  IMAGE: ghcr.io/usbkayble/beammp-docker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest BeamMP-Server release
        id: beammp
        run: |
          curl -fsSL https://api.github.com/repos/BeamMP/BeamMP-Server/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"\(.*\)".*/\1/' \
            > /tmp/beammp_version
          echo "version=$(cat /tmp/beammp_version)" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.beammp.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          build-args: |
            BEAMMP_VERSION=${{ steps.beammp.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull ${{ env.IMAGE }}:latest

      - name: Start server (dummy auth, 10s)
        run: |
          docker run -d --name beammp-test \
            -p 30814:30814/tcp -p 30814:30814/udp \
            -e BEAMMP_AUTH_KEY=000000000000000000000000000000000000 \
            ${{ env.IMAGE }}:latest
          # Give it a moment to boot and bind the port
          for i in $(seq 1 30); do
            if timeout 1 bash -c 'echo > /dev/tcp/localhost/30814' 2>/dev/null; then
              echo "PORT OPEN after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs beammp-test
          echo "Port 30814 never opened"; exit 1

      - name: Check logs show clean startup
        run: |
          docker logs beammp-test 2>&1 | grep -qiE 'error|failed' && \
            (echo "Unexpected error in logs:"; docker logs beammp-test; exit 1) || \
            echo "No errors in startup logs"

      - name: Verify graceful shutdown
        run: |
          # entrypoint must answer SIGTERM with the console 'exit' command:
          # the server kicks players, runs onShutdown, and exits 0. Without
          # this, 'docker stop' would hang for 20s and SIGKILL (exit 137).
          timeout 15 docker stop -t 10 beammp-test
          code=$(docker inspect -f '{{.State.ExitCode}}' beammp-test)
          echo "container exit code: $code"
          [ "$code" = "0" ] || { docker logs beammp-test; exit 1; }
          docker logs beammp-test 2>&1 | grep -q "Shutdown\." || \
            { echo "No graceful Shutdown. in logs:"; docker logs beammp-test; exit 1; }
          echo "Graceful shutdown OK"

  tunnel-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull ${{ env.IMAGE }}:latest

      - name: Start frps bridge
        run: |
          docker network create frpnet
          cat > /tmp/frps.toml <<'EOF'
          bindPort = 7000
          auth.method = "token"
          auth.token = "ci-shared-secret"
          EOF
          # The frps image entrypoint is bare /usr/bin/frps - pass -c explicitly
          docker run -d --name frps-test \
            --network frpnet \
            -p 7000:7000/tcp -p 30814:30814/tcp -p 30814:30814/udp \
            -v /tmp/frps.toml:/etc/frp/frps.toml:ro \
            fatedier/frps:v0.70.1 -c /etc/frp/frps.toml
          # Wait until frps is actually listening (image pull + boot can take a while)
          for i in $(seq 1 30); do
            if timeout 1 bash -c 'echo > /dev/tcp/localhost/7000' 2>/dev/null; then
              echo "frps ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs frps-test
          echo "frps never became ready"; exit 1

      - name: Start server with tunnel enabled
        run: |
          # Custom network resolves frps-test by name; BEAMMP_FRP_SERVER must be
          # the frps container name (127.0.0.1 would be the container's own loopback)
          docker run -d --name beammp-tunnel \
            --network frpnet \
            -e BEAMMP_AUTH_KEY=000000000000000000000000000000000000 \
            -e BEAMMP_FRP_SERVER=frps-test \
            -e BEAMMP_FRP_TOKEN=ci-shared-secret \
            ${{ env.IMAGE }}:latest
          for i in $(seq 1 45); do
            if timeout 1 bash -c 'echo > /dev/tcp/localhost/30814' 2>/dev/null; then
              echo "TUNNEL OPEN after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs frps-test
          docker logs beammp-tunnel
          echo "Tunneled port 30814 never opened"; exit 1

      - name: Check frpc registered both proxies
        run: |
          docker logs beammp-tunnel 2>&1 | grep -q "login to server success" || \
            { echo "frpc did not reach frps:"; docker logs beammp-tunnel; exit 1; }
          docker logs frps-test 2>&1 | grep -q "new proxy \[beammp-tcp\] type \[tcp\] success" || \
            { echo "TCP proxy not registered on frps:"; docker logs frps-test; exit 1; }
          docker logs frps-test 2>&1 | grep -q "new proxy \[beammp-udp\] type \[udp\] success" || \
            { echo "UDP proxy not registered on frps:"; docker logs frps-test; exit 1; }
          echo "Both TCP and UDP proxies registered"

      - name: Verify graceful shutdown with tunnel
        run: |
          timeout 15 docker stop -t 10 beammp-tunnel
          code=$(docker inspect -f '{{.State.ExitCode}}' beammp-tunnel)
          echo "container exit code: $code"
          [ "$code" = "0" ] || { docker logs beammp-tunnel; exit 1; }
          docker logs beammp-tunnel 2>&1 | grep -q "Shutdown\." || \
            { echo "No graceful Shutdown. in logs:"; docker logs beammp-tunnel; exit 1; }
          echo "Graceful shutdown with tunnel OK"
